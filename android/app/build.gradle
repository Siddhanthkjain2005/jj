plugins { id 'com.android.application' }

// Release signing reads android/keystore.properties (created by tools/android-release.sh, never committed).
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.velocityverse.game'
    compileSdk 36
    buildFeatures { buildConfig = true }
    defaultConfig {
        applicationId 'com.velocityverse.game'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '0.8.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            if (keystoreProps['storeFile']) signingConfig signingConfigs.release
        }
    }
    lint { abortOnError = false }
    sourceSets { main { assets.srcDir(layout.buildDirectory.dir('generated/gameAssets').get().asFile) } }
}

// Always package the current standalone build, never a hand-maintained HTML copy.
def syncGameAssets = tasks.register('syncGameAssets', Copy) {
    from(rootProject.file('../dist/velocityverse.html'))
    into(layout.buildDirectory.dir('generated/gameAssets'))
    from(rootProject.file('../assets/fonts')) { include '*-OFL.txt'; into 'legal/fonts' }
    doFirst {
        if (!rootProject.file('../dist/velocityverse.html').exists()) {
            throw new GradleException('Build the game first: npm run build at the repository root.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn(syncGameAssets) }

dependencies {
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'
}
