plugins { id 'com.android.application' }

android {
    namespace 'com.velocityverse.game'
    compileSdk 36
    buildFeatures { buildConfig = true }
    defaultConfig {
        applicationId 'com.velocityverse.game'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '0.5.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release { minifyEnabled false }
    }
    sourceSets { main { assets.srcDir(layout.buildDirectory.dir('generated/gameAssets').get().asFile) } }
}

// Always package the current standalone build, never a hand-maintained HTML copy.
def syncGameAssets = tasks.register('syncGameAssets', Copy) {
    from(rootProject.file('../dist/velocityverse.html'))
    into(layout.buildDirectory.dir('generated/gameAssets'))
    from(rootProject.file('../assets/fonts')) { include '*-OFL.txt'; into 'legal/fonts' }
    doFirst {
        if (!rootProject.file('../dist/velocityverse.html').exists()) {
            throw new GradleException('Build the game first: npm run build at the repository root.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn(syncGameAssets) }

dependencies {
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'
}
